<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e6a4e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131815" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="Persönliches Rezeptbuch mit Einkaufsliste nach Laufweg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="rochen-192.png" type="image/png">
<link rel="apple-touch-icon" href="rochen-192.png">
<title>Mein Rezeptbuch</title>
<style>
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: sticky header with two tabs; recipe cards in a wrapping grid; detail and editor slide up as a sheet. */
:root {
  --paper: #f3f5ef;
  --surface: #ffffff;
  --ink: #1b241f;
  --muted: #5d6a62;
  --line: #dbe1d6;
  --accent: #2e6a4e;
  --accent-soft: #e2eee6;
  --accent-ink: #ffffff;
  --mark: #d9a21f;
  --danger: #b23a2b;
  --heart: #d23f58;
  --shade: rgba(20, 28, 24, .45);
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131815; --surface: #1b221e; --ink: #e7ece5; --muted: #9ba79f; --line: #2b3530;
    --accent: #72c198; --accent-soft: #213229; --accent-ink: #0e1913; --mark: #e8b84a; --danger: #ec7b6b; --heart: #f27d90;
    --shade: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131815; --surface: #1b221e; --ink: #e7ece5; --muted: #9ba79f; --line: #2b3530;
  --accent: #72c198; --accent-soft: #213229; --accent-ink: #0e1913; --mark: #e8b84a; --danger: #ec7b6b; --heart: #f27d90;
  --shade: rgba(0,0,0,.6); color-scheme: dark;
}
.card { position: relative; }
.card h3 { padding-right: 34px; }
.heart { border: 0; background: transparent; width: 38px; height: 38px; border-radius: 999px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.heart:hover { color: var(--heart); }
.heart svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.heart[aria-pressed="true"] { color: var(--heart); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.card .heart { position: absolute; top: 8px; right: 8px; }
@media (prefers-reduced-motion: no-preference) { .heart[aria-pressed="true"] svg { animation: pop .25s ease-out; } @keyframes pop { 50% { transform: scale(1.25); } } }
.panel-btns { display: flex; gap: 6px; align-items: center; }
.chip .h { color: var(--heart); }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 24px; line-height: 1.1; margin: 0; flex: 1 1 auto; }
.brand small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: .02em; margin-top: 2px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.count { font-family: var(--mono); font-size: 12px; min-width: 20px; padding: 0 5px; border-radius: 999px; background: var(--mark); color: #1b1404; text-align: center; }

main .wrap { padding-block: 20px 60px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 220px; min-width: 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-open { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.card-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.tag { background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 6px; letter-spacing: .04em; }
.card h3 { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.peek { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .btn { align-self: flex-start; margin-top: auto; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-family: var(--display); font-weight: 400; color: var(--ink); margin: 0; font-size: 22px; }

/* Einkaufsliste */
.list-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.list-head h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.for { font-size: 13px; color: var(--muted); margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.aisle { margin-bottom: 18px; }
.aisle h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { display: grid; grid-template-columns: 26px 86px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.noqty { grid-template-columns: 26px 1fr auto; }
.ing.noqty li { grid-template-columns: 24px 1fr; }
.ing-edit.noqty .ing-row { grid-template-columns: 1fr 1fr 32px; }
.ing-edit.noqty .qf { display: none; }
@media (max-width: 560px) { .ing-edit.noqty .ing-row { grid-template-columns: 1fr 32px; } .ing-edit.noqty .ing-row .aisle-sel { grid-column: 1 / 2; } }
.switch { display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; color: var(--ink); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.qty { font-family: var(--mono); font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.iname { min-width: 0; }
.src { display: block; font-size: 12px; color: var(--muted); }
.item.done .iname, .item.done .qty { text-decoration: line-through; color: var(--muted); }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 2px 6px; border-radius: 6px; line-height: 1; }
.x:hover { color: var(--danger); }
.adder { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 24px; }
.adder input { flex: 1 1 200px; min-width: 0; }
.field, .adder input, .adder select { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.panel { background: var(--surface); width: 100%; max-width: 720px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 760px) { .sheet { align-items: center; } .panel { border-radius: 18px; max-height: 88%; } }
@media (prefers-reduced-motion: no-preference) { .panel { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
.panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 6px 0 4px; text-wrap: balance; }
.close { border: 1px solid var(--line); background: transparent; border-radius: 999px; width: 36px; height: 36px; font-size: 18px; flex: none; }
.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; text-transform: none; letter-spacing: 0; }
.stepper button { border: 0; background: transparent; width: 32px; height: 30px; font-size: 16px; }
.stepper span { font-family: var(--mono); font-size: 13px; color: var(--ink); min-width: 74px; text-align: center; }
.ing { list-style: none; padding: 0; margin: 0; }
.ing li { display: grid; grid-template-columns: 24px 92px 1fr; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dotted var(--line); }
.ing input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.ing li.off .qty, .ing li.off span:last-child { color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.steps { padding-left: 22px; margin: 0; display: grid; gap: 8px; max-width: 65ch; }
.steps li::marker { font-family: var(--mono); color: var(--accent); }
.notes { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; max-width: 65ch; }
.panel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; justify-content: space-between; }
.sticky-cta { position: sticky; bottom: -28px; background: var(--surface); padding-top: 12px; margin-top: 12px; }

/* Formular */
.form { display: grid; gap: 14px; margin-top: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.form .field { width: 100%; font-weight: 400; color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row label { flex: 1 1 110px; }
.row label:first-child { flex: 3 1 220px; }
.ing-edit { display: grid; gap: 8px; }
.ing-row { display: grid; grid-template-columns: 70px 84px 1fr 1fr 32px; gap: 6px; align-items: center; }
.ing-row .field { padding: 8px 9px; font-size: 14px; }
@media (max-width: 560px) { .ing-row { grid-template-columns: 64px 78px 1fr 32px; } .ing-row .aisle-sel { grid-column: 1 / 4; } }
textarea.field { min-height: 130px; resize: vertical; }
.err { color: var(--danger); font-size: 13px; }

.sugg { position: fixed; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 4px; max-height: 248px; overflow-y: auto; }
.sugg-row { padding: 9px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.sugg-row:hover, .sugg-row.on { background: var(--accent-soft); }
.sugg-row b { color: var(--accent); font-weight: 700; }
.sugg-tag { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.route { list-style: none; padding: 0; margin: 18px 0 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.route li { display: grid; grid-template-columns: 22px 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px 8px 14px; border-top: 1px solid var(--line); }
.route li:first-child { border-top: 0; }
.route-n { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.route-name { min-width: 0; font-weight: 500; }
.route li { background: var(--surface); }
.route li.dragging { background: var(--accent-soft); box-shadow: 0 6px 18px rgba(0,0,0,.18); position: relative; z-index: 1; }
.grip { cursor: grab; touch-action: none; user-select: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 6px 2px; text-align: center; }
.grip:active { cursor: grabbing; }
.route-btns { display: flex; gap: 4px; }
.mv { width: 36px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 16px; }
.mv:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.mv:disabled { opacity: .3; cursor: default; }
.ing-row2 { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); }
.ing-row2:first-child { border-top: 0; }
.ing-row2 .use { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ing-row2.hit { background: var(--accent-soft); }
#ing-hint b { color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); }
.mode { font-size: 12px; color: var(--muted); text-align: center; margin-top: 30px; }
.backup { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.backup .btn { font-size: 13px; padding: 7px 12px; }
.code-box { font-family: var(--mono); font-size: 22px; letter-spacing: .06em; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 14px 16px; text-align: center; overflow-wrap: anywhere; }
.form label.switch { display: flex; color: var(--ink); font-weight: 500; }
.code-in { font-family: var(--mono); letter-spacing: .05em; text-transform: uppercase; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 class="brand">Mein Rezeptbuch<small>Die Gerichte, die ich immer wieder koche</small></h1>
    <nav class="tabs" role="tablist" aria-label="Ansicht">
      <button class="tab" role="tab" id="tab-recipes" aria-selected="true" data-view="recipes">Rezepte</button>
      <button class="tab" role="tab" id="tab-list" aria-selected="false" data-view="list">Einkaufsliste <span class="count" id="list-count" hidden>0</span></button>
      <button class="tab" role="tab" id="tab-ing" aria-selected="false" data-view="ingredients">Zutaten</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="view-recipes">
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Rezept oder Zutat suchen …" aria-label="Suchen">
        <button class="btn primary" id="new-recipe">+ Neues Rezept</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="view-ingredients" hidden>
      <div class="list-head">
        <div>
          <h2>Zutaten</h2>
          <div class="for" id="ing-count"></div>
        </div>
      </div>
      <form class="adder" id="ing-form" style="margin-bottom:6px">
        <input id="ing-new" autocomplete="off" aria-autocomplete="list" placeholder="Zutat suchen oder neu eintragen …" aria-label="Zutat suchen oder neu eintragen">
        <select id="ing-aisle" aria-label="Abteilung"></select>
        <button class="btn primary" type="submit" id="ing-add">Hinzufügen</button>
      </form>
      <p class="hint" id="ing-hint" style="margin:0 0 18px;min-height:1.5em"></p>
      <div id="ing-list"></div>
    </section>

    <section id="view-list" hidden>
      <div class="list-head">
        <div>
          <h2>Einkaufsliste</h2>
          <div class="for" id="list-for"></div>
        </div>
        <div class="actions">
          <button class="btn" id="route">Laufweg anpassen</button>
          <button class="btn" id="copy-list">Liste kopieren</button>
          <button class="btn" id="clear-done">Erledigte entfernen</button>
          <button class="btn danger" id="clear-all">Liste leeren</button>
        </div>
      </div>
      <form class="adder" id="adder">
        <input id="adder-name" autocomplete="off" aria-autocomplete="list" placeholder="Noch etwas dazu, z. B. 1 l Milch" aria-label="Artikel hinzufügen">
        <select id="adder-aisle" aria-label="Abteilung"></select>
        <button class="btn" type="submit">Hinzufügen</button>
      </form>
      <div id="list"></div>
    </section>
    <div class="mode">
      <p id="mode" style="margin:0">Deine Daten sind auf diesem Handy gespeichert und funktionieren auch offline.</p>
      <div class="backup">
        <button class="btn" id="sync-open" hidden>Mit Mitbewohner synchronisieren</button>
        <button class="btn" id="exp">Sicherung speichern</button>
        <label class="btn" for="imp-file" style="cursor:pointer">Sicherung laden</label>
        <input type="file" id="imp-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const AISLES = ["Bäckerei", "Früchte & Gemüse", "Milch, Käse & Eier", "Fleisch & Fisch", "Beilagen & Saisonales", "Öl, Saucen & Eingemachtes", "Teigwaren, Reis & Backzutaten", "Konserven & International", "Gewürze", "Tiefkühl", "Frühstück & Snacks", "Getränke", "Sonstiges"];
  const UNITS = ["", "g", "kg", "ml", "dl", "l", "EL", "TL", "Stk", "Zehe", "Bund", "Dose", "Pck", "Prise", "Becher"];
  const CATS = ["Pasta", "Fleisch", "Vegetarisch", "Fisch", "Suppe", "Salat", "Backen", "Dessert", "Frühstück", "Anderes"];

  /* Abteilung automatisch erkennen. Reihenfolge zählt: der erste Treffer gewinnt.
     "-wort" = Wortende (z. B. -öl trifft Olivenöl, nicht Oliven). Wörter bis 3 Buchstaben nur als ganzes Wort. */
  const AUTO = [
    ["Beilagen & Saisonales", ["rotkraut", "rotkohl", "blaukraut", "rehpfeffer", "wildpfeffer", "spätzli", "knöpfli", "marroni", "rosenkohl gekocht"]],
    ["Bäckerei", ["hefe", "bagel"]],
    ["Teigwaren, Reis & Backzutaten", ["tomatensauce", "pastasauce", "sugo"]],
    ["Konserven & International", ["tortilla", "taco", "wraps", "nachos", "jalape"]],
    ["Öl, Saucen & Eingemachtes", ["essiggurken", "cornichons", "silberzwiebeln", "kapern"]],
    ["Öl, Saucen & Eingemachtes", ["-öl"]],
    ["Früchte & Gemüse", ["rucola", "grüne bohnen", "kefen", "frühlingszwiebel", "bundzwiebel"]],

  /* ---------- Einkaufsliste ---------- */
  function addToList(items, recipeName) {
    const l = clone(list);
    l.items = l.items || []; l.recipes = l.recipes || [];
    let added = 0;
    items.forEach((ing) => {
      const fam = family(ing.unit);
      const key = ing.name.trim().toLowerCase() + "|" + fam;
      const base = toBase(ing.qty, ing.unit);
      const nm = ing.name.trim().toLowerCase();
      const hit = l.items.find((x) => x.key === key) ||
        l.items.find((x) => x.name.toLowerCase() === nm && (x.qty == null || base == null));
      if (hit) {
        if (hit.qty == null && base != null) { hit.unit = fam; hit.key = key; }
        if (hit.done) { hit.done = false; hit.qty = base; hit.sources = []; }
        else if (hit.qty != null && base != null) hit.qty += base;
        else if (base != null) hit.qty = base;
        if (recipeName && !hit.sources.includes(recipeName)) hit.sources.push(recipeName);
      } else {
        l.items.push({ id: uid(), key, name: ing.name.trim(), qty: base, unit: fam, aisle: ing.aisle || "Sonstiges", done: false, sources: recipeName ? [recipeName] : [] });
      }
      added++;
    });
    if (recipeName && !l.recipes.includes(recipeName)) l.recipes.push(recipeName);
    store.saveList(l);
    return added;
  }

  sug.addEventListener("mousedown", (e) => e.preventDefault());
  sug.addEventListener("click", (e) => { const row = e.target.closest("[data-sg]"); if (row) pickSugg(+row.dataset.sg); });
  document.addEventListener("keydown", (e) => {
    if (sug.hidden || e.target !== sugInput) return;
    if (e.key === "ArrowDown") { e.preventDefault(); sugIdx = (sugIdx + 1) % sugItems.length; markSugg(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sugIdx = (sugIdx - 1 + sugItems.length) % sugItems.length; markSugg(); }
    else if ((e.key === "Enter" || e.key === "Tab") && sugIdx >= 0) { e.preventDefault(); pickSugg(sugIdx); }
    else if (e.key === "Escape") { e.stopPropagation(); hideSugg(); }
  }, true);
  document.addEventListener("focusout", (e) => { if (e.target === sugInput) setTimeout(() => { if (document.activeElement !== sugInput) hideSugg(); }, 150); });
  document.addEventListener("scroll", (e) => { if (!sug.hidden && e.target !== sug) hideSugg(); }, true);
  window.addEventListener("resize", hideSugg);

  document.addEventListener("input", (e) => {
    const t = e.target;
    let sel = null;
    if (/^n-\d+$/.test(t.id) || t.id === "adder-name" || t.id === "ing-new") showSugg(t);
    if (t.id === "ing-new") renderIngredients();
    if (/^n-\d+$/.test(t.id)) sel = $("#a-" + t.id.slice(2));
    else if (t.id === "adder-name") sel = $("#adder-aisle");
    else if (t.id === "ing-new") sel = $("#ing-aisle");
    if (!sel || sel.dataset.manual) return;
    sel.value = guessAisle(t.value) || "Sonstiges";
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "f-withqty") {
      const keep = editing.ingredients;
      const wasOn = editing.withQty;
      readEditor();
      if (!wasOn && t.checked) editing.ingredients.forEach((i, k) => { if (keep[k]) { i.qty = keep[k].qty; i.unit = keep[k].unit; } });
      editing.withQty = t.checked; drawEditor(); return;
    }
    if (/^a-\d+$/.test(t.id) || t.id === "adder-aisle" || t.id === "ing-aisle") t.dataset.manual = "1";
    if (t.dataset.need !== undefined) { detail.need[+t.dataset.need] = t.checked; drawDetail(); const f = $("#need-" + t.dataset.need); if (f) f.focus(); }
    if (t.dataset.tick !== undefined) {
      if (!guard()) { t.checked = !t.checked; return; }
      const l = clone(list); l.items[+t.dataset.tick].done = t.checked; store.saveList(l);
    }
  });

  document.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.id === "join-form") { syncJoin(); return; }
    if (e.target.id === "ing-form") {
      if (!guard()) return;
      const nm = capFirst($("#ing-new").value), lk = nm.toLowerCase();
      if (!nm) return;
      const ex = allIngredientNames().find((x) => x.key === lk);
      if (ex) { toast(ex.name + " ist schon gespeichert"); return; }
      extras = extras.concat(nm).slice(-300);
      extraAisles = Object.assign({}, extraAisles, { [lk]: $("#ing-aisle").value });
      try { await store.saveExtras(extras, extraAisles); toast(nm + " gespeichert"); } catch (err) { fail(err); }
      $("#ing-new").value = ""; delete $("#ing-aisle").dataset.manual; $("#ing-aisle").value = "Sonstiges";
      renderIngredients(); $("#ing-new").focus();
      return;
    }
    if (e.target.id === "adder") {
      if (!guard()) return;
      const raw = $("#adder-name").value.trim();
      if (!raw) return;
      const m = raw.match(/^([\d.,\/½¼¾]+)\s*(kg|g|ml|dl|l|EL|TL|Stk|Bund|Dose|Pck|Becher)?\.?\s+(.+)$/i);
      let ing = { qty: null, unit: "", name: raw, aisle: $("#adder-aisle").value };
      if (m) { const u = m[2] ? UNITS.find((x) => x.toLowerCase() === m[2].toLowerCase()) || "" : ""; ing = { qty: parseQty(m[1]), unit: u, name: m[3], aisle: ing.aisle }; }
      addToList([ing], null);
      const nm = ing.name.trim(), lk = nm.toLowerCase();
      if (nm && !knownNames().some((e) => e.name.toLowerCase() === lk)) { extras = extras.concat(nm).slice(-300); extraAisles = Object.assign({}, extraAisles, { [lk]: ing.aisle }); store.saveExtras(extras, extraAisles).catch(() => {}); }
      $("#adder-name").value = ""; $("#adder-name").focus();
      delete $("#adder-aisle").dataset.manual; $("#adder-aisle").value = "Sonstiges";
      return;
    }
    if (e.target.id === "editor") {
      readEditor();
      const r = editing;
      r.ingredients = r.ingredients.filter((i) => i.name);
      if (!r.name) { drawEditor("Gib dem Rezept einen Namen."); return; }
      if (!r.ingredients.length) { r.ingredients.push({ qty: null, unit: "", name: "", aisle: "Sonstiges" }); drawEditor("Füge mindestens eine Zutat hinzu."); return; }
      if (!guard()) return;
      const id = r.id; const wasCopy = r.isCopy; const data = Object.assign({}, r); delete data.id; delete data.example; delete data.isCopy;
      data.updatedAt = Date.now();
      hideSheet();
      try { await store.saveRecipe(id, data); toast(id ? "Rezept gespeichert" : wasCopy ? "Kopie angelegt" : "Rezept angelegt"); } catch (err) { fail(err); }
    }
  });

  $("#clear-done").addEventListener("click", () => { if (!guard()) return; const l = clone(list); l.items = l.items.filter((i) => !i.done); if (!l.items.length) l.recipes = []; store.saveList(l); });
  $("#clear-all").addEventListener("click", (e) => { if (!guard()) return; arm(e.currentTarget, "Wirklich leeren?", () => store.saveList({ items: [], recipes: [] })); });
  $("#copy-list").addEventListener("click", () => {
    const line = (i) => "- " + (pretty(i.qty, i.unit) ? pretty(i.qty, i.unit) + " " : "") + i.name;
    let text;
    if (hasRoute()) {
      const r = rankFn();
      text = (list.items || []).filter((i) => !i.done).sort((x, y) => r(x.name, x.aisle) - r(y.name, y.aisle)).map(line).join("\n");
    } else {
      text = orderedAisles().map((a) => {
        const rows = (list.items || []).filter((i) => !i.done && (i.aisle || "Sonstiges") === a);
        return rows.length ? a + "\n" + rows.map(line).join("\n") : "";
      }).filter(Boolean).join("\n\n");
    }
    const done = () => toast("Liste kopiert");
    try {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
    } catch (err) { fallbackCopy(text); }
  });
  function fallbackCopy(text) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); toast(ok ? "Liste kopiert" : "Kopieren geht hier nicht. Markiere die Liste von Hand.");
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) hideSheet(); });

  $("#adder-aisle").innerHTML = opt(AISLES, "Sonstiges");
  $("#ing-aisle").innerHTML = opt(AISLES, "Sonstiges");
  try { const v = localStorage.getItem("rb-view"); if (v === "list" || v === "ingredients") setView(v); } catch (e) {}
  $("#imp-file").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; if (f) importBackup(f); e.target.value = ""; });
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  boot();
})();
</script>
</body>
</html>
